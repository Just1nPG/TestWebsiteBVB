<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Just1nPG</title>

  <style>
    :root {
      color-scheme: dark;
      --yellow: #f7d417;
      --background: #090b0e;
      --text: #f5f3e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(1.25rem, 5vw, 4rem);
      background:
        radial-gradient(ellipse at 50% 45%, #202329 0%, transparent 58%),
        linear-gradient(135deg, #0d0f12, var(--background) 65%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      content: "";
      pointer-events: none;
    }

    body::before {
      width: min(72vw, 700px);
      aspect-ratio: 1;
      top: -34%;
      right: -15%;
      border: 1px solid rgb(247 212 23 / 14%);
      border-radius: 50%;
      box-shadow:
        0 0 0 45px rgb(247 212 23 / 3%),
        0 0 0 110px rgb(247 212 23 / 2%);
    }

    body::after {
      width: 42vw;
      height: 7px;
      left: -8vw;
      bottom: 12%;
      transform: rotate(-35deg);
      background: linear-gradient(90deg, transparent, var(--yellow), transparent);
      opacity: 0.75;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 960px);
      padding: clamp(2.5rem, 8vw, 6.5rem) clamp(1.5rem, 7vw, 5.5rem);
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 24px;
      background: linear-gradient(145deg, rgb(29 32 37 / 94%), rgb(16 18 21 / 96%));
      box-shadow:
        0 28px 90px rgb(0 0 0 / 55%),
        inset 0 1px rgb(255 255 255 / 6%);
      text-align: center;
      animation: rise-in 700ms ease-out both;
    }

    main::before {
      position: absolute;
      top: 0;
      left: 18%;
      width: 64%;
      height: 3px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--yellow), transparent);
      box-shadow: 0 0 24px rgb(247 212 23 / 50%);
    }

    main::after {
      position: absolute;
      right: -45px;
      bottom: -70px;
      width: 180px;
      aspect-ratio: 1;
      content: "";
      border: 22px solid rgb(247 212 23 / 7%);
      border-radius: 50%;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--text);
      font-size: clamp(2rem, 6.5vw, 5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    h1::selection {
      color: var(--background);
      background: var(--yellow);
    }

    .download-button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2rem;
      padding: 0.9rem 1.4rem;
      border: 0;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--background);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .download-button:hover {
      transform: translateY(-2px);
      background: #ffe34d;
    }

    .download-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      main {
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Test Technologischer fortschritt BVB</h1>
    <a class="download-button" href="datei.zip" download>
      ZIP-Datei herunterladen
    </a>
  </main>
</body>
</html>
